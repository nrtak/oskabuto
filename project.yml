name: PrivacyGuard
options:
  bundleIdPrefix: com.example.privacyguard
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  PrivacyGuard:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: CallDirectory
      - target: MessageFilter
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: Privacy Guard
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan QR codes locally to inspect their contents before opening them.
        NSFaceIDUsageDescription: Kabuto checks whether Face ID is set up on this device.
    entitlements:
      path: Configuration/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.privacyguard]
  CallDirectory:
    type: app-extension
    platform: iOS
    sources: [Extensions/CallDirectory, Shared/CallStore.swift]
    info:
      path: Configuration/Call-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Configuration/Call.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.privacyguard]
  MessageFilter:
    type: app-extension
    platform: iOS
    sources: [Extensions/MessageFilter, Shared/SafetyEngine.swift]
    info:
      path: Configuration/Message-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterHandler
