name: SimpleCurrency
options:
  bundleIdPrefix: com.nrtak
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  SimpleCurrency:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecurrency.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Simple Currency
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to remember an item with its saved currency conversion.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SimpleCurrencyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SimpleCurrency
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SimpleCurrency:
    build:
      targets:
        SimpleCurrency: all
    test:
      targets: [SimpleCurrencyTests]
