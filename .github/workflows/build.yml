name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Select iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in sorted(d["devices"].items(), reverse=True) if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -project SimpleCurrency.xcodeproj -scheme SimpleCurrency \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tee build.log
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build.log
            TestResults.xcresult
