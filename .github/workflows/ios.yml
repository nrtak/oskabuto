name: iOS Prototype

on:
  push:
    paths-ignore:
      - .github/workflows/testflight.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate and verify Xcode project
        run: python3 tools/verify_project.py
      - name: Show selected Apple toolchain
        run: xcodebuild -version
      - name: Test local safety rules
        run: swift test
      - name: Build simulator prototype and extensions
        run: |
          xcodebuild \
            -project PrivacyGuard.xcodeproj \
            -scheme PrivacyGuard \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/BuildResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch prototype in simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/PrivacyGuard.app
          xcrun simctl launch "$SIMULATOR_ID" com.example.privacyguard -welcomed YES
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Prototype-preview.png
          echo "KABUTO_TEST_SIMULATOR=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Try Home, checker, and protection flows
        run: |
          xcodebuild test -project PrivacyGuard.xcodeproj -scheme PrivacyGuard \
            -destination "platform=iOS Simulator,id=$KABUTO_TEST_SIMULATOR" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -resultBundlePath build/FlowResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload prototype preview
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyGuard-preview
          path: build/Prototype-preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyGuard-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/PrivacyGuard.app
          if-no-files-found: error
          retention-days: 7
      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-diagnostics
          path: build/BuildResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
